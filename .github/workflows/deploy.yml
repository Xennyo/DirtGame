# Publie le jeu sur Cloudflare Workers (projet « dirtygame ») à chaque changement sur main.
# Secrets à créer dans GitHub (Settings > Secrets and variables > Actions) :
#   CLOUDFLARE_API_TOKEN  : jeton Cloudflare avec le modèle « Edit Cloudflare Workers »
#   CLOUDFLARE_ACCOUNT_ID : identifiant du compte Cloudflare
name: Déployer sur Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
